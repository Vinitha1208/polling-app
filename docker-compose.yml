version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: livepolling-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - polling-network

  redis:
    image: redis:7.2-alpine
    container_name: livepolling-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - polling-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livepolling-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=livepolling
      - REDIS_URL=redis:6379
      - JWT_SECRET=guvi_developer_internship_jwt_secret_key_2026_super_secure
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis
    networks:
      - polling-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livepolling-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - polling-network

networks:
  polling-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
